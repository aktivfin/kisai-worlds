name: CI

on:
  push:
    branches: [main, feature/ui-platform-061]
  pull_request:
    branches: [main]

jobs:
  code:
    name: Source syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm run validate:ui
      - run: npm run test:smoke

  assets:
    name: Required media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate:assets
